name: Build Release

# DECISION (v0.15.12 cleanup): trigger is workflow_dispatch ONLY.
# The tags push trigger (v*.*.*) was REMOVED — every tag run failed
# (ubuntu runner + raw PyInstaller cannot produce the Windows exe),
# which caused a flood of failure emails. Release builds are now
# dispatched manually; the tag trigger returns once this workflow is
# proven end to end.
on:
  workflow_dispatch:

jobs:
  build:
    name: Build Executable (GENERAL)
    runs-on: windows-latest

    # No variant matrix: scripts/build_GENERAL_v2.py takes NO CLI args and
    # hardcodes the GENERAL variant. The old `--variant` matrix argument was
    # silently ignored, producing three identical builds per run.
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Run PyInstaller build (GENERAL variant)
        run: |
          python scripts/build_GENERAL_v2.py

      - name: List build outputs
        shell: bash
        run: |
          ls -lh dist/
          ls -lh _build_artifacts/

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Audio2Text-GENERAL-exe
          path: dist/*.exe
          retention-days: 30

      - name: Upload build logs
        uses: actions/upload-artifact@v4
        with:
          name: Audio2Text-GENERAL-logs
          path: _build_artifacts/logs/**/*.log
          retention-days: 7
        continue-on-error: true

  # Release publication only makes sense for tag refs. Manual dispatches on
  # a branch build artifacts ONLY — no release named after the branch.
  # This job activates automatically again once the tag trigger returns.
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all executables
        uses: actions/download-artifact@v4
        with:
          pattern: Audio2Text-*-exe
          merge-multiple: true
          path: executables

      - name: Download all logs
        uses: actions/download-artifact@v4
        with:
          pattern: Audio2Text-*-logs
          merge-multiple: true
          path: logs
        continue-on-error: true

      - name: Display structure of downloaded files
        run: |
          ls -R executables/
          ls -R logs/ || true

      - name: Generate release notes
        run: |
          echo "Release ${{ github.ref_name }}" > release_notes.txt
          echo "" >> release_notes.txt
          echo "## Build Artifacts" >> release_notes.txt
          echo "" >> release_notes.txt
          echo "This release includes the GENERAL variant:" >> release_notes.txt
          echo "- **GENERAL**: Generic CENF build" >> release_notes.txt
          echo "" >> release_notes.txt
          echo "## Installation" >> release_notes.txt
          echo "" >> release_notes.txt
          echo "1. Download the executable" >> release_notes.txt
          echo "2. Run the installer" >> release_notes.txt
          echo "3. Enjoy!" >> release_notes.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            executables/*.exe
          body_path: release_notes.txt
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    name: Notify Build Status
    runs-on: ubuntu-latest
    needs: [build, create-release]
    if: always()

    steps:
      - name: Send notification
        run: |
          echo "Build completed for ${{ github.ref_name }}"
          echo "Status: ${{ needs.build.result }}"
          echo "Release: ${{ needs.create-release.result }}"
