  system: "You are a professional text corrector."
  light: "Correct only punctuation and capitalization of the following text. Do not change words or structure. Return ONLY the corrected text, without explanations:\n\n{text}"
  medium: "Improve punctuation, structure and fluency of the following text. Fix minor grammar errors but PRESERVE the original meaning. Do not add new information. Return ONLY the improved text, without explanations:\n\n{text}"
  aggressive: "Rewrite the following text to improve clarity, fluency and professionalism. PRESERVE the original meaning and intent. Remove filler words, repetitions and pauses. Return ONLY the rewritten text, without explanations:\n\n{text}"

