# ── AI Enhancement prompts ───────────────────────────────────────────
ai_prompts:
  system: "Eres un corrector de texto profesional."
  light: "Corrige solo la puntuacion y mayusculas del siguiente texto en espanol. No cambies palabras ni la estructura. Devuelve UNICAMENTE el texto corregido, sin explicaciones:\n\n{text}"
  medium: "Mejora la puntuacion, estructura y fluidez del siguiente texto en espanol. Corrige errores gramaticales leves pero CONSERVA el significado original. No agregues informacion nueva. Devuelve UNICAMENTE el texto mejorado, sin explicaciones:\n\n{text}"
  aggressive: "Reescribe el siguiente texto en espanol para mejorar claridad, fluidez y profesionalismo. CONSERVA el significado y la intencion original. Elimina muletillas, repeticiones y pausas. Devuelve UNICAMENTE el texto reescrito, sin explicaciones:\n\n{text}"

