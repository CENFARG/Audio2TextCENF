# Audio2Text v0.16 — Default configuration
# These values are used when no config file exists.
# They match the Pydantic schema in audio2text/config/schema.py

version: "0.16.0"

providers:
  primary: groq
  fallback_chain: []
  groq:
    api_key_secret_key: groq_api_key
    model: whisper-large-v3
    base_url: https://api.groq.com
    timeout_s: 60.0
    max_retries: 3
  faster_whisper:
    model_size: base
    device: auto
    compute_type: auto
    models_dir: ./models
    vad_filter: true
    vad_min_silence_ms: 500
    beam_size: 5
    enabled: false
  nvidia_riva:
    host: grpc.nvcf.nvidia.com
    port: 443
    use_ssl: true
    api_key_secret_key: nvidia_api_key
    model: parakeet-1.1b
    enabled: false
    connection_mode: cloud

audio:
  sample_rate_hz: 16000
  channels: 1
  buffer_seconds: 600
  device_index: null
  save_recordings: true
  recordings_dir: ./audio
  record_mode: toggle
  max_recording_time_s: 300
  max_audio_files: 100
  auto_cleanup_enabled: true

hotkey:
  record_toggle: f8
  cancel: Esc
  enabled: true

localization:
  language: es_ES
  fallback: en_US
  locales_dir: ./audio2text/locales

history:
  max_entries: 100
  cleanup_older_than_days: 90
  history_file: ./data/history.jsonl

vocabulary:
  custom_path: ./vocabulary/custom.json
  tech_path: ./vocabulary/ia_tech.json
  general_path: ./vocabulary/general.json

context_blocks:
  enabled: true
  directory: .
  task_extractor_enabled: true
  summary_enabled: true
  keyword_extractor_enabled: true

ai_enhancement:
  enabled: true
  default_profile: medium
  default_provider: groq
  groq_model: llama-3.1-70b-versatile
  openai_model: gpt-4o-mini

api:
  host: 127.0.0.1
  port: 8765
  cors_origins:
    - "http://localhost:*"

ui:
  theme: system
  window_width: 1100
  window_height: 760
  show_overlay: true
  auto_paste: true
  show_transcription_panel: true

logging:
  profile: production
  logs_dir: ./logs
  pii_masking: true
  rotate_max_bytes: 5242880
  rotate_backup_count: 5

startup: false
sounds_enabled: true
