[pytest]
# Pytest configuration for Audio2Text testing

# Test discovery paths
testpaths = tests

# Python files to consider as tests
python_files = test_*.py

# Python classes to consider as test classes
python_classes = Test*

# Python functions to consider as tests
python_functions = test_*

# Coverage configuration
addopts =
    --cov=backend
    --cov=tests
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-fail-under=40
    -v
    --strict-markers
    --tb=short

# Coverage minimum (fail under 70%)
# Note: This is also set in addopts above for redundancy

# Markers for test categorization
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, may use external services)
    slow: Slow tests (may take > 1 second)
    api: Tests that require API access (Groq, OpenAI, etc.)

# Asyncio mode
asyncio_mode = auto

# Ignore paths
norecursedirs = .git .venv venv build dist _old_versions_archive .context

# Logging configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Warnings configuration
filterwarnings =
    error
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
